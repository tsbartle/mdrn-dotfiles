################################################################################
#  ~/.config/tmux/tmux.reset.conf  --  KEYBINDINGS
#
#  Philosophy: stock tmux defaults are the base. We do NOT `unbind-key -a`.
#  Everything below is either (a) a binding carried over from ~/tmux.conf.old,
#  or (b) an *additive* binding from the borrowed config that lands on a key
#  tmux leaves free.
#
#  Bindings from the borrowed config that would have clobbered a default
#  (c=kill-pane, s=split, x=swap-pane, w=list-windows, l=refresh-client,
#  "=choose-window, , . - = resize) were dropped; the defaults win.
#  Full default list: https://github.com/tmux/tmux/blob/master/key-bindings.c
################################################################################

# ==============================================================================
#  PREFIX
# ==============================================================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix      # C-a C-a -> pass prefix through to a nested tmux
bind-key a   last-window      # C-a a   -> toggle last window

# ==============================================================================
#  CONFIG RELOAD
# ==============================================================================
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ==============================================================================
#  COPY MODE (vi)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
# NOTE: tmux-yank loads after this file and rebinds `y` to copy-pipe-and-cancel,
# which does the same thing *and* pushes to the macOS system clipboard. That is
# a strict superset, so we let it win.

# Overrides the default 'p' = previous-window (C-a n / C-a a still get you
# around). The floax floating pane moved to 'P' to make room -- see tmux.conf.
bind-key p paste-buffer

# ==============================================================================
#  PANES
# ==============================================================================
# Navigation -- additive, tmux binds none of these by default at the prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Splits that inherit the current directory. '|' and '_' are free by default;
# the stock '%' and '"' splits still work (and still start in $HOME).
bind-key | split-window -h -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

bind-key z resize-pane -Z            # same as the default, kept explicit
bind-key b set pane-border-status    # was 'P' upstream; 'P' now belongs to floax
bind-key K send-keys "clear" \; send-keys "Enter"

# Resize: use the stock prefix + Arrow keys (repeatable).
# Kill pane: stock 'x'.  Swap pane: stock '{' / '}'.

# ==============================================================================
#  WINDOWS
# ==============================================================================
bind-key H previous-window
bind-key L next-window
bind-key C-c new-window -c "$HOME"
bind-key C-w list-windows
bind-key * setw synchronize-panes
# New window: stock 'c'.  Rename: stock ','.  Window chooser: stock 'w'.

# ==============================================================================
#  SESSIONS / CLIENT
# ==============================================================================
bind-key S choose-session
bind-key C-d detach
bind-key C-x lock-server
bind-key C-l refresh-client
# Session chooser: stock 's'.  Client chooser: stock 'D'.

# ==============================================================================
#  LAZYGIT
# ==============================================================================
# opencode has no keybind action that can run a shell command or launch an
# external TUI (184 actions in its tui.json schema, none of them shell), so the
# popup lives here instead. tmux grabs the prefix before opencode -- or nvim, or
# anything else in the pane -- ever sees it, so C-a g works from inside all of
# them. 'g' is free in stock tmux and unclaimed by every plugin in tmux.conf
# (floax='P', sessionx='o'). -E closes the popup when lazygit exits.
bind-key g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
