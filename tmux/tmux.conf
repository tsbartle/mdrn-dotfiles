################################################################################
#  ~/.config/tmux/tmux.conf
#
#  Look & feel: borrowed config (catppuccin + the plugin set).
#  Keys & behaviour: carried over from ~/tmux.conf.old -- see tmux.reset.conf,
#  which owns the prefix and every keybinding.
################################################################################

source-file ~/.config/tmux/tmux.reset.conf

# ==============================================================================
#  TERMINAL
# ==============================================================================
# 'screen-256color' rather than 'tmux-256color' to avoid
# "'tmux-256color': unknown terminal type" on hosts with an old terminfo db.
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# ==============================================================================
#  GENERAL BEHAVIOUR
# ==============================================================================
set -g mouse on                  # from tmux.conf.old
set -g focus-events on           # from tmux.conf.old
set -g display-time 2000         # messages stay up 2s (tmux.conf.old)
set -g status-interval 5         # keep any %H:%M in the status bar honest
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # ...and panes too (tmux.conf.old)
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

# Label every auto-named window with the hostname, as tmux.conf.old did.
# Comment this out to get the usual per-window process name back, or swap in
# the directory instead:  set -g automatic-rename-format "#{b:pane_current_path}"
set -g automatic-rename-format "#h"

# ==============================================================================
#  PANE BORDERS  (borrowed config's theme)
# ==============================================================================
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ==============================================================================
#  PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# --- fzf-url ------------------------------------------------------------------
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# --- floax (floating pane) ----------------------------------------------------
# Moved from 'p' to 'P': 'p' is paste-buffer, per tmux.conf.old.
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'P'
set -g @floax-change-path 'true'

# --- sessionx -----------------------------------------------------------------
set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
# Both were inherited from the borrowed omerxx config and pointed at ~/dotfiles
# (that clone), not this repo. tmux expands $HOME in option values at parse
# time, so sessionx still reads an absolute path -- which @sessionx-custom-paths
# requires, since it word-splits the value straight into `find` with no shell
# expansion. Append more with commas.
set -g @sessionx-custom-paths "$HOME/mdrn-dotfiles"
set -g @sessionx-x-path "$HOME/mdrn-dotfiles"   # dir that ctrl-x indexes (default: ~/.config)
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# --- resurrect / continuum ----------------------------------------------------
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# --- catppuccin ---------------------------------------------------------------
# Official catppuccin/tmux (v2 API). Unlike the old fork, there is no
# @catppuccin_status_modules_right -- modules are appended to status-right
# below. The #{E:...} form expands at draw time, so these may be set before
# tpm runs.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# Paint the bar in @thm_bg (#1e1e2e) rather than catppuccin's default
# @thm_mantle (#181825). Two things depend on this being right:
#   1. ghostty's Catppuccin Mocha background IS #1e1e2e, so mantle shows up as
#      a visible band behind the whole status row (both rows -- the blank
#      breathing-room line is painted with status-style too).
#   2. The rounded pill end-caps are drawn as `fg=#{@_ctp_status_bg},reverse`,
#      so the cap colour must equal the bar's actual background or the pills
#      get halos. This option sets status-style AND @_ctp_status_bg together,
#      which is why it is the right knob -- overriding status-style by hand
#      fixes the band but breaks the caps.
# Do NOT use the literal "none": it puts the string "none" into
# @_ctp_status_bg, which tmux cannot resolve as a colour, and every cap
# renders as a dark blob. Must be set before tpm runs.
set -g @catppuccin_status_background "#{@thm_bg}"

# Windows: rounded pills, number on the LEFT, flags (zoom/bell) as icons.
# Number position matters for legibility: with it on the right, catppuccin's
# rounded style puts a plain space between the name pill and the number pill,
# which is the same width as tmux's between-window separator -- so every number
# reads as belonging to the *next* window. Leading with the number groups each
# pair unambiguously.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "none"
# Same centring problem as the module icons: the stock number is a bare "#I",
# so it sits flush against the left cap. Pad the number on the left, giving
# "<cap> 1 <cap>"-style symmetry in the number block.
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
# Keep the stock LEADING space on the name: it is the small margin between the
# colour boundary and the text (upstream uses " #T"). Dropping it left every
# label flush against the left edge of its block. No trailing space needed:
# @catppuccin_window_flags_icon_format already ends with one, whether or not
# any flag is actually showing.
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# The gap BETWEEN windows has to beat the gap INSIDE one, or each
# "<number> <name>" pair stops reading as a single unit. Inside a window the
# separation is carried mostly by the COLOUR boundary between the number block
# and the name block, not by whitespace, so one space here is enough to win --
# this was two, which was wider than it needed to be. If windows start running
# together visually, put the second space back rather than chasing it in the
# catppuccin variables. tmux defaults this to one space; catppuccin never sets
# it.
set -g window-status-separator " "

# Make the modules real pills, like the windows.
#
# The window pills come from @catppuccin_window_*_separator, which the
# "rounded" style sets to a MATCHED pair: U+E0B6 left cap + U+E0B4 right cap.
# The status MODULES use a completely separate set of options, and catppuccin
# ships them mismatched -- left is U+E0B6 but right is a plain space -- so
# every module renders with a rounded left end and a squared-off right end.
# Supplying the missing right cap is the whole fix.
# The left and middle ones are pinned too, even though they equal the stock
# values: the plugin only fills these in when they are UNSET, so a stale value
# left on a running server by an earlier experiment (an empty left separator,
# a space in the middle one) survives every `source-file` and silently drops
# the left cap, leaving a square-ended pill.
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""

# "no" makes each module reset to bg=default before its left cap, so the pills
# are discrete. With the default "yes" they deliberately run together, which is
# why date-time and host read as one long joined block.
set -g @catppuccin_status_connect_separator "no"

# Centre the icons. The stock icon strings are "<glyph> " -- a trailing space
# and no leading one -- so inside the coloured block the glyph sits flush
# against the left cap. @catppuccin_status_middle_separator cannot fix this: it
# is emitted AFTER the icon, so it only pads the same side again. Re-declaring
# the icon with a space on both sides is what actually centres it.
set -g @catppuccin_session_icon " "
set -g @catppuccin_date_time_icon "󰃰 "
set -g @catppuccin_host_icon "󰒋 "

# Module contents. Padding mirrors the window pills: a space on BOTH sides of
# the text. The leading one is the margin after the icon/text colour boundary
# (stock has it too); the trailing one is the margin before the right cap,
# which stock lacks because its right "separator" is a bare space.
set -g @catppuccin_session_text " #S "
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M "
set -g @catppuccin_host_text " #h "

# Status line: session on the left; date/time and host on the right.
# The directory module (#{b:pane_current_path}) was deliberately dropped -- it
# showed the basename of the pane's cwd, which is just "tsbartle" whenever a
# pane sits in $HOME. Re-add with: set -ag status-right "#{E:@catppuccin_status_directory}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
# window-status-separator only applies BETWEEN windows, never between
# status-left and the first one, so without this the first window pill butts
# straight up against the session pill.
# Matched to window-status-separator above so the session pill sits the same
# distance from window 1 as the windows sit from each other.
set -ag status-left " "
set -g status-right "#{E:@catppuccin_status_date_time}"
# Discrete pills have no trailing space of their own, so without this the
# date-time and host pills butt straight into each other.
set -ag status-right " "
set -ag status-right "#{E:@catppuccin_status_host}"

run '~/.config/tmux/plugins/tpm/tpm'

# ==============================================================================
#  POST-PLUGIN OVERRIDES
# ==============================================================================
# Anything catppuccin sets with plain `set -gq` (no -o) has to be overridden
# AFTER tpm runs, because -gq overwrites unconditionally -- setting it earlier
# in this file is silently discarded. Contrast @catppuccin_status_*_separator
# above, which upstream sets with `set -ogq`: the -o means "only if unset", so
# those overrides work before tpm. The asymmetry is not documented upstream;
# it's in catppuccin_tmux.conf (window middle separator ~line 141, status
# separators ~line 139 of catppuccin_options_tmux.conf).
#
# Uncomment to close the whitespace between the number block and the name block
# inside each window pill, leaving only the colour boundary between them. This
# tightens the windows further than window-status-separator alone. Both lines
# are needed -- the "current" variant is copied from the base one at plugin
# load, so setting only one makes the active window diverge from the rest.
# Requires `tmux kill-server`; these values survive a plain `source-file`.
# set -g @catppuccin_window_middle_separator ""
# set -g @catppuccin_window_current_middle_separator ""

# ==============================================================================
#  BREATHING ROOM UNDER THE STATUS BAR
# ==============================================================================
# status-position is top, and tmux stacks every status line on that same side,
# so asking for 2 lines puts the second one directly BELOW the catppuccin bar.
# Blanking it turns that row into empty margin between the bar and the pane.
# (tmux's stock status-format[1] is a pane-index debug readout, not empty.)
# Costs one row of usable height. Set back to 'on' to reclaim it.
# Must come after tpm so nothing a plugin does can clobber it.
set -g status 2
set -g status-format[1] ''
